  - content: "---\npackages:\n  cargo:satelle-cli:\n    type: patch\n---\n\n## Windows bootstrap maintenance and slow-daemon startup\n\nAdmit the managed-setup action shapes in bootstrap maintenance so full setup\nno longer fails at maintenance begin. Report bootstrap-busy when the Windows\nlock holder exits with the busy code, and wait out the daemon's own readiness\nbudgets before declaring a slow Windows daemon unreachable.\n"
    filename: 2026-09-11-windows-bootstrap-maintenance.md
    v: 0.0.0

name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "npm/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/install.ps1"
      - "scripts/install.sh"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      operation:
        description: Non-publishing release diagnostic or recovery
        required: true
        type: choice
        default: diagnostics
        options:
          - diagnostics
          - candidate-resume
          - candidate-finalize
          - candidate-tag-repair
          - rollback
      version:
        description: Existing release version for recovery
        required: false
        type: string
      recover_rolled_back:
        description: Explicitly resume promotion after a completed rollback
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.operation != 'diagnostics')) && 'satelle-npm-release-writer' || format('release-candidate-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'diagnostics'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64-gnu
            rust-target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            executable: satelle
          - target: linux-x64-gnu
            rust-target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            executable: satelle
          - target: darwin-arm64
            rust-target: aarch64-apple-darwin
            runner: macos-15
            executable: satelle
          - target: darwin-x64
            rust-target: x86_64-apple-darwin
            runner: macos-15-intel
            executable: satelle
          - target: win32-arm64-msvc
            rust-target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            executable: satelle.exe
          - target: win32-x64-msvc
            rust-target: x86_64-pc-windows-msvc
            runner: windows-2025
            executable: satelle.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Rust target
        shell: bash
        run: rustup toolchain install 1.97.0 --profile minimal --target "${{ matrix.rust-target }}"

      - name: Build native release executable
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_PROFILE_RELEASE_DEBUG: 0
          RUSTFLAGS: -D warnings
        run: cargo build --locked --release -p satelle-cli --target ${{ matrix.rust-target }}

      - name: Stage native npm package
        shell: bash
        run: |
          mkdir -p dist
          node npm/scripts/release.cjs stage-native \
            "${{ matrix.target }}" \
            "target/${{ matrix.rust-target }}/release/${{ matrix.executable }}" \
            dist

      - name: Create Unix release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=$(node npm/scripts/release.cjs check | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          tar -czf "dist/satelle-v${version}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.rust-target }}/release" satelle

      - name: Create Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = (node npm/scripts/release.cjs check | ConvertFrom-Json).version
          Compress-Archive `
            -LiteralPath "target/${{ matrix.rust-target }}/release/satelle.exe" `
            -DestinationPath "dist/satelle-v$Version-${{ matrix.target }}.zip"

      - name: Upload target artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  collect:
    name: Validate release graph and publish dry-runs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm workspace
        run: npm ci --ignore-scripts

      - name: Install pinned Tegami release tooling
        run: npm ci --prefix npm/release-tooling --ignore-scripts

      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Read canonical release plan
        id: plan
        shell: bash
        run: |
          version=$(node npm/scripts/release.cjs check | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Stage top-level npm packages
        run: node npm/scripts/release.cjs stage-launchers dist

      - name: Validate npm package graph
        run: node npm/scripts/release.cjs validate-npm-artifacts dist --write-manifest

      - name: Validate native archives and create SHA256SUMS
        run: node npm/scripts/release.cjs validate-native-release-archives dist validated

      - name: Validate Tegami Cargo release behavior
        id: tegami
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        shell: bash
        run: |
          error_log="$RUNNER_TEMP/tegami-validation.stderr"
          set +e
          npm run dry-run --prefix npm/release-tooling --silent \
            > validated/tegami-validation.json \
            2> "$error_log" && \
            SATELLE_TEGAMI_RELEASE_VERSION="$RELEASE_VERSION" \
              npm run tegami --prefix npm/release-tooling -- publish \
              >> "$error_log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            node npm/scripts/release-tooling-gate.cjs record-failure \
              validated/tegami-validation.json
          fi
          exit "$status"

      - name: Select reviewed release orchestration
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          TEGAMI_OUTCOME: ${{ steps.tegami.outcome }}
        run: |
          node npm/scripts/release-tooling-gate.cjs select \
            "$RELEASE_VERSION" \
            "$TEGAMI_OUTCOME" \
            validated/tegami-validation.json \
            npm/release-tooling/manual-release.json \
            validated/release-orchestration.json

      - name: Verify committed Tegami changelog output
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node npm/scripts/release-tooling-gate.cjs verify-changelogs \
            "$RELEASE_VERSION" \
            validated/tegami-changelog-validation.json

      - name: Complete validated npm publication set
        shell: bash
        run: |
          cp \
            ./dist/npm-satelle-scoped.tgz \
            ./dist/npm-satelle-unscoped.tgz \
            ./dist/npm-artifacts.json \
            validated/npm/
          chmod 400 validated/npm/*
          chmod 500 validated/npm validated

      - name: Run npm package dry-runs sequentially
        shell: bash
        run: |
          for package in \
            ./validated/npm/npm-linux-arm64-gnu.tgz \
            ./validated/npm/npm-linux-x64-gnu.tgz \
            ./validated/npm/npm-darwin-arm64.tgz \
            ./validated/npm/npm-darwin-x64.tgz \
            ./validated/npm/npm-win32-arm64-msvc.tgz \
            ./validated/npm/npm-win32-x64-msvc.tgz \
            ./dist/npm-satelle-scoped.tgz \
            ./dist/npm-satelle-unscoped.tgz
          do
            npm pack "$package" --dry-run --ignore-scripts
          done

      - name: Upload validated release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release-candidate
          path: validated
          if-no-files-found: error

  attest:
    name: Attest signed-tag release candidate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [collect, lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      source-digest: ${{ steps.tag.outputs.source-digest }}
      tag-digest: ${{ steps.tag.outputs.tag-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-candidate
          path: validated

      - name: Resolve verified signed tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.collect.outputs.version }}
        shell: bash
        run: |
          release_tag_not_trusted() {
            printf '{"code":"release-tag-not-trusted","message":"%s"}\n' "$1" >&2
            exit 1
          }

          test "$GITHUB_REF_NAME" = "v${RELEASE_VERSION}" || \
            release_tag_not_trusted "release tag does not match the validated version"
          if ! tag_ref=$(gh api "repos/${{ github.repository }}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type + " " + .object.sha'); then
            release_tag_not_trusted "release tag ref cannot be resolved"
          fi
          test "${tag_ref%% *}" = tag || \
            release_tag_not_trusted "release tag is not annotated"
          tag_digest=${tag_ref#* }
          if ! source_digest=$(gh api "repos/${{ github.repository }}/git/tags/$tag_digest" --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha'); then
            release_tag_not_trusted "annotated release tag cannot be resolved"
          fi
          test -n "$source_digest" || \
            release_tag_not_trusted "release tag signature is not GitHub-verified"
          if ! default_branch=$(gh api "repos/${{ github.repository }}" --jq .default_branch); then
            release_tag_not_trusted "default branch cannot be resolved"
          fi
          if ! default_head=$(gh api "repos/${{ github.repository }}/git/ref/heads/$default_branch" --jq .object.sha); then
            release_tag_not_trusted "default branch head cannot be resolved"
          fi
          if ! compare_status=$(gh api "repos/${{ github.repository }}/compare/${source_digest}...${default_head}" --jq .status); then
            release_tag_not_trusted "release tag commit cannot be compared with the default branch"
          fi
          test "$source_digest" = "$GITHUB_SHA" || \
            release_tag_not_trusted "release tag moved after the workflow started"
          if [ "$compare_status" != identical ] && [ "$compare_status" != ahead ]; then
            release_tag_not_trusted "release tag does not point at a commit on the default branch"
          fi
          if ! release_pr_count=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${{ github.repository }}/commits/$source_digest/pulls" \
            | jq \
              --arg branch "$default_branch" \
              --arg sha "$source_digest" \
              '[.[] | select(.merged_at != null and .base.ref == $branch and .merge_commit_sha == $sha)] | length'); then
            release_tag_not_trusted "release pull request provenance cannot be resolved"
          fi
          test "$release_pr_count" = 1 || \
            release_tag_not_trusted "release tag commit was not produced by one merged release pull request"
          printf 'source-digest=%s\n' "$source_digest" >> "$GITHUB_OUTPUT"
          printf 'tag-digest=%s\n' "$tag_digest" >> "$GITHUB_OUTPUT"

      - name: Attest every native archive
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: validated/github/satelle-*

      - name: Verify archive attestations against canonical policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.collect.outputs.version }}
          SOURCE_DIGEST: ${{ steps.tag.outputs.source-digest }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        shell: bash
        run: |
          for archive in validated/github/satelle-*; do
            node npm/scripts/release.cjs verify-release-attestation \
              "$archive" \
              "$RELEASE_VERSION" \
              "$SOURCE_DIGEST" \
              "$ATTESTATION_BUNDLE"
          done

  lifecycle:
    name: Install, upgrade, smoke, and uninstall ${{ matrix.target }}
    needs: collect
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-arm64-msvc
            runner: windows-11-arm
          - target: win32-x64-msvc
            runner: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-candidate
          path: validated

      - name: Validate Unix archive lifecycle
        if: runner.os != 'Windows'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.collect.outputs.version }}
        shell: bash
        run: |
          checkout_root=$PWD
          release_root=$(cd validated/github && pwd)
          archive="satelle-v${RELEASE_VERSION}-${RELEASE_TARGET}.tar.gz"
          cd "$release_root"
          if command -v sha256sum >/dev/null 2>&1; then
            grep "  ${archive}$" SHA256SUMS | sha256sum -c -
          else
            grep "  ${archive}$" SHA256SUMS | shasum -a 256 -c -
          fi
          extract_root=$(mktemp -d)
          install_root=$(mktemp -d)
          command_root=$(mktemp -d)
          policy_log=$(mktemp)
          trap 'rm -rf "$extract_root" "$install_root" "$command_root"; rm -f "$policy_log"' EXIT
          tar -xzf "$archive" -C "$extract_root"
          printf old > "$install_root/satelle"
          cp "$extract_root/satelle" "$install_root/satelle"
          chmod 755 "$install_root/satelle"
          test "$("$install_root/satelle" --version)" = "satelle $RELEASE_VERSION"
          test "$("$install_root/satelle" paths --json | jq -r .schema_version)" = satelle.paths.v2
          rm "$install_root/satelle"
          test ! -e "$install_root/satelle"

          cat > "$command_root/curl" <<'SH'
          #!/bin/sh
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -o) destination=$2; shift 2 ;;
              http*) source_url=$1; shift ;;
              *) shift ;;
            esac
          done
          cp "$SATELLE_RELEASE_FIXTURES/${source_url##*/}" "$destination"
          SH
          cat > "$command_root/gh" <<'SH'
          #!/bin/sh
          printf '%s\n' "$*" >> "$SATELLE_POLICY_LOG"
          if [ "$1" = api ]; then
            case "$2" in
              */git/ref/tags/*) printf '%s\n' 'tag bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' ;;
              */git/tags/*) printf '%s\n' 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' ;;
            esac
          fi
          SH
          chmod 755 "$command_root/curl" "$command_root/gh"
          export PATH="$command_root:$PATH"
          export SATELLE_RELEASE_FIXTURES="$release_root"
          export SATELLE_POLICY_LOG="$policy_log"

          script_install_root=$(mktemp -d)
          trap 'rm -rf "$extract_root" "$install_root" "$command_root" "$script_install_root"; rm -f "$policy_log"' EXIT
          "$checkout_root/scripts/install.sh" --version "$RELEASE_VERSION" --bin-dir "$script_install_root"
          printf old > "$script_install_root/satelle"
          : > "$policy_log"
          "$checkout_root/scripts/install.sh" --version "$RELEASE_VERSION" --bin-dir "$script_install_root"
          test "$("$script_install_root/satelle" --version)" = "satelle $RELEASE_VERSION"
          test "$(jq -r .target "$script_install_root/.satelle-install.json")" = "$RELEASE_TARGET"
          grep -q -- '--deny-self-hosted-runners' "$policy_log"
          "$checkout_root/scripts/install.sh" --uninstall --bin-dir "$script_install_root"
          test ! -e "$script_install_root/satelle"
          test ! -e "$script_install_root/.satelle-install.json"

      - name: Validate Windows archive lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "${{ needs.collect.outputs.version }}"
          $Archive = "satelle-v$Version-${{ matrix.target }}.zip"
          $ReleaseRoot = Resolve-Path "validated/github"
          $Entry = Get-Content "$ReleaseRoot/SHA256SUMS" | Where-Object { $_ -match "^([0-9a-f]{64})  $([regex]::Escape($Archive))$" }
          if (@($Entry).Count -ne 1) { throw "missing canonical checksum for $Archive" }
          $Digest = (Get-FileHash "$ReleaseRoot/$Archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Digest -ne $Entry.Substring(0, 64)) { throw "checksum mismatch for $Archive" }
          $ExtractRoot = Join-Path $env:RUNNER_TEMP "satelle-extract"
          $InstallRoot = Join-Path $env:RUNNER_TEMP "satelle-install"
          New-Item -ItemType Directory -Path $InstallRoot -Force | Out-Null
          Expand-Archive "$ReleaseRoot/$Archive" $ExtractRoot
          Set-Content "$InstallRoot/satelle.exe" "old"
          Copy-Item "$ExtractRoot/satelle.exe" "$InstallRoot/satelle.exe" -Force
          if ((& "$InstallRoot/satelle.exe" --version) -ne "satelle $Version") { throw "version smoke failed" }
          $Paths = & "$InstallRoot/satelle.exe" paths --json | ConvertFrom-Json
          if ($Paths.schema_version -ne "satelle.paths.v2") { throw "paths smoke failed" }
          Remove-Item "$InstallRoot/satelle.exe"
          if (Test-Path "$InstallRoot/satelle.exe") { throw "uninstall failed" }

      - name: Validate Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "${{ needs.collect.outputs.version }}"
          $FixtureRoot = (Resolve-Path "validated/github").Path
          $InstallRoot = Join-Path $env:RUNNER_TEMP "satelle-script-install"
          $PolicyLog = Join-Path $env:RUNNER_TEMP "satelle-gh-policy.log"
          $CommandRoot = Join-Path $env:RUNNER_TEMP "satelle-installer-commands"
          New-Item -ItemType Directory -Path $CommandRoot -Force | Out-Null
          $env:SATELLE_POLICY_LOG = $PolicyLog
          $env:PATH = "$CommandRoot;$env:PATH"
          @'
          @echo off
          echo %*>>"%SATELLE_POLICY_LOG%"
          echo %~2| findstr /C:"/git/ref/tags/" >nul && echo {"object":{"type":"tag","sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}} && exit /b 0
          echo %~2| findstr /C:"/git/tags/" >nul && echo {"verification":{"verified":true},"object":{"type":"commit","sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}} && exit /b 0
          echo [{}]
          '@ | Set-Content -LiteralPath (Join-Path $CommandRoot "gh.cmd") -Encoding ascii
          function global:Invoke-WebRequest {
            param(
              [string]$Uri,
              [string]$OutFile,
              [int]$ConnectionTimeoutSeconds,
              [int]$OperationTimeoutSeconds
            )
            if ($ConnectionTimeoutSeconds -ne 10 -or $OperationTimeoutSeconds -ne 300) {
              throw "installer HTTP timeout policy mismatch"
            }
            Copy-Item -LiteralPath (Join-Path $FixtureRoot ([System.IO.Path]::GetFileName($Uri))) -Destination $OutFile
          }
          & scripts/install.ps1 -Version $Version -BinDir $InstallRoot
          Set-Content -LiteralPath (Join-Path $InstallRoot "satelle.exe") -Value old
          Clear-Content -LiteralPath $PolicyLog
          & scripts/install.ps1 -Version $Version -BinDir $InstallRoot
          if ((& (Join-Path $InstallRoot "satelle.exe") --version) -ne "satelle $Version") { throw "installer upgrade failed" }
          $Receipt = Get-Content (Join-Path $InstallRoot ".satelle-install.json") | ConvertFrom-Json
          if ($Receipt.version -ne $Version -or $Receipt.target -ne "${{ matrix.target }}") { throw "installer receipt mismatch" }
          if ((Get-Content $PolicyLog -Raw) -notmatch "--deny-self-hosted-runners") { throw "attestation policy was not invoked" }
          & scripts/install.ps1 -Uninstall -BinDir $InstallRoot
          if (Test-Path (Join-Path $InstallRoot "satelle.exe")) { throw "installer uninstall failed" }

  draft-release:
    name: Create authenticated draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attest, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-candidate
          path: validated

      - name: Create or update draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.collect.outputs.version }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Satelle v${RELEASE_VERSION}" \
              --generate-notes
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            validated/tegami-validation.json \
            validated/tegami-changelog-validation.json \
            validated/release-orchestration.json \
            validated/github/* \
            validated/npm/npm-artifacts.json
          expected_assets=$(
            {
              find validated/github -maxdepth 1 -type f -printf '%f\n'
              printf '%s\n' \
                npm-artifacts.json \
                release-orchestration.json \
                tegami-changelog-validation.json \
                tegami-validation.json
            } | LC_ALL=C sort
          )
          version_pattern=${RELEASE_VERSION//./\\.}
          candidate_pattern="^npm-candidate-v${version_pattern}-[0-9]+-[0-9]+-[0-9]+\\.json$"
          promotion_pattern="^npm-promotion-v${version_pattern}-[0-9]+-[0-9]+-[0-9]+\\.json$"
          actual_assets=$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' \
              | while IFS= read -r asset_name; do
                  if [[ "$asset_name" =~ $candidate_pattern || "$asset_name" =~ $promotion_pattern ]]; then
                    continue
                  fi
                  printf '%s\n' "$asset_name"
                done \
              | LC_ALL=C sort
          )
          if [ "$actual_assets" != "$expected_assets" ]; then
            printf '%s\n' "release asset set does not match the validated artifact set" >&2
            exit 1
          fi

  publish-candidates:
    name: Publish immutable npm candidates
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attest, collect, draft-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: npm-candidate-publication-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm CLI
        shell: bash
        run: |
          npm install --global npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-candidate
          path: validated

      - name: Publish native, scoped, then unscoped candidate packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.collect.outputs.version }}
          EXPECTED_SOURCE_DIGEST: ${{ needs.attest.outputs.source-digest }}
          EXPECTED_TAG_DIGEST: ${{ needs.attest.outputs.tag-digest }}
        shell: bash
        run: |
          release_tag_not_trusted() {
            printf '{"code":"release-tag-not-trusted","message":"%s"}\n' "$1" >&2
            exit 1
          }
          recheck_release_tag() {
            current_tag_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
              --jq 'select(.object.type == "tag") | .object.sha') || \
              release_tag_not_trusted "release tag ref cannot be resolved"
            test -n "$current_tag_digest" && test "$current_tag_digest" = "$EXPECTED_TAG_DIGEST" || \
              release_tag_not_trusted "release tag object moved after attestation"
            current_source_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$EXPECTED_TAG_DIGEST" \
              --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha') || \
              release_tag_not_trusted "annotated release tag cannot be resolved"
            test -n "$current_source_digest" && test "$current_source_digest" = "$EXPECTED_SOURCE_DIGEST" || \
              release_tag_not_trusted "release tag source changed after attestation"
            is_draft=$(gh release view \
              "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft) || \
              release_tag_not_trusted "GitHub release cannot be resolved"
            test "$is_draft" = true || \
              release_tag_not_trusted "GitHub release is no longer draft"
          }

          record="$RUNNER_TEMP/npm-candidate-publication.json"
          checkpoint() {
            sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).sequence))' "$record")
            snapshot="$RUNNER_TEMP/npm-candidate-v${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${sequence}.json"
            cp "$record" "$snapshot"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$snapshot"
          }
          node npm/scripts/npm-candidate-publication.cjs create \
            "$RELEASE_VERSION" \
            validated/npm/npm-artifacts.json \
            "$record"
          checkpoint
          trap 'checkpoint' ERR
          max_advances=$(node -e 'process.stdout.write(String(require(process.argv[1]).packages.length))' "$record")
          advances=0
          while [ "$(node -e 'process.stdout.write(require(process.argv[1]).status)' "$record")" != complete ]; do
            before_sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).sequence))' "$record")
            recheck_release_tag
            node npm/scripts/npm-candidate-publication.cjs advance "$record" validated/npm
            after_sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).sequence))' "$record")
            test "$after_sequence" -gt "$before_sequence" || {
              echo "candidate publication sequence did not advance" >&2
              exit 1
            }
            advances=$((advances + 1))
            test "$advances" -le "$max_advances" || {
              echo "candidate publication exceeded its package count" >&2
              exit 1
            }
            checkpoint
          done
          trap - ERR

  validate-registry-candidates:
    name: Validate npm candidates on ${{ matrix.target }}
    if: >-
      ${{
        always() &&
        (
          (startsWith(github.ref, 'refs/tags/v') &&
            needs.collect.result == 'success' &&
            needs.publish-candidates.result == 'success') ||
          (github.event_name == 'workflow_dispatch' &&
            inputs.operation == 'candidate-finalize' &&
            needs.authorize-recovery-tag.result == 'success')
        )
      }}
    needs: [authorize-recovery-tag, collect, publish-candidates]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-arm64-msvc
            runner: windows-11-arm
          - target: win32-x64-msvc
            runner: windows-2025
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install pnpm
        run: npm install --global pnpm@11.15.0

      - name: Clean-install and smoke both launcher identities
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && needs.collect.outputs.version || inputs.version }}
        shell: bash
        run: |
          root="$RUNNER_TEMP/satelle-registry-validation"
          mkdir -p "$root"
          smoke() {
            binary=$1
            test "$("$binary" --version)" = "satelle $RELEASE_VERSION"
            "$binary" paths --json | node -e '
              const value = JSON.parse(require("fs").readFileSync(0, "utf8"));
              if (value.schema_version !== "satelle.paths.v2") process.exit(1);
            '
          }
          for package_name in @microck/satelle satelle; do
            package_label=$(printf '%s' "$package_name" | tr '/@' '__')
            package_spec="${package_name}@${RELEASE_VERSION}"
            for manager in npm pnpm bun; do
              install_root="$root/${manager}-${package_label}"
              mkdir -p "$install_root"
              node -e 'require("fs").writeFileSync(process.argv[1], "{\"private\":true}\n")' "$install_root/package.json"
              case "$manager" in
                npm) npm install --prefix "$install_root" --include=optional --ignore-scripts --no-audit --no-fund "$package_spec" ;;
                pnpm) pnpm --dir "$install_root" add --ignore-scripts "$package_spec" ;;
                bun) bun add --cwd "$install_root" --ignore-scripts "$package_spec" ;;
              esac
              smoke "$install_root/node_modules/.bin/satelle"
            done
          done

  promote-and-publish:
    name: Promote npm graph and publish GitHub release
    if: >-
      ${{
        always() &&
        needs.validate-registry-candidates.result == 'success' &&
        (
          (startsWith(github.ref, 'refs/tags/v') &&
            needs.attest.result == 'success' &&
            needs.collect.result == 'success' &&
            needs.draft-release.result == 'success') ||
          (github.event_name == 'workflow_dispatch' &&
            inputs.operation == 'candidate-finalize' &&
            needs.authorize-recovery-tag.result == 'success')
        )
      }}
    needs: [attest, authorize-recovery-tag, collect, draft-release, validate-registry-candidates]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      SATELLE_RELEASE_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate-finalize' && '1' || '0' }}
      SATELLE_RELEASE_RECOVERY_OPERATION: candidate-finalize
      SATELLE_RELEASE_RECOVERY_SOURCE_ROOT: ${{ github.workspace }}/signed-release-source
      SATELLE_RELEASE_RECOVERY_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
      VERIFIED_SOURCE_DIGEST: ${{ startsWith(github.ref, 'refs/tags/v') && needs.attest.outputs.source-digest || needs.authorize-recovery-tag.outputs.source-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check out signed release metadata for recovery
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate-finalize'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: signed-release-source
          ref: ${{ needs.authorize-recovery-tag.outputs.source-digest }}

      - name: Install Node.js for npm dist-tag recovery
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm CLI
        run: npm install --global npm@11.5.1

      - name: Download validated release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-candidate
          path: validated

      - name: Download the exact signed-tag candidate for recovery
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate-finalize'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_DIGEST: ${{ needs.authorize-recovery-tag.outputs.source-digest }}
        shell: bash
        run: |
          recovery_source_not_trusted() {
            jq -cn \
              --arg message "$1" \
              '{code:"recovery-source-not-trusted", message:$message}' >&2
            exit 1
          }
          tag="v${RELEASE_VERSION}"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || \
            recovery_source_not_trusted "GitHub release is not draft"
          source_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&branch=${tag}&per_page=100")
          source_run_ids=$(printf '%s' "$source_runs" | jq -c \
            --arg source_digest "$VERIFIED_SOURCE_DIGEST" \
            --arg tag "$tag" \
            '[.workflow_runs[] | select(
              .head_branch == $tag and
              .head_sha == $source_digest and
              .event == "push" and
              .status == "completed" and
              .conclusion == "failure"
            ) | .id]')
          source_run_count=$(printf '%s' "$source_run_ids" | jq -r 'length')
          test "$source_run_count" = 1 || \
            recovery_source_not_trusted "expected one failed signed-tag run; found ${source_run_count}"
          source_run_id=$(printf '%s' "$source_run_ids" | jq -r '.[0]')
          gh run download "$source_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name validated-release-candidate \
            --dir validated

      - name: Promote latest tags with durable checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          SATELLE_PROMOTION_RECORD_KEY: ${{ secrets.NPM_PROMOTION_RECORD_KEY }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && needs.collect.outputs.version || inputs.version }}
          EXPECTED_SOURCE_DIGEST: ${{ startsWith(github.ref, 'refs/tags/v') && needs.attest.outputs.source-digest || needs.authorize-recovery-tag.outputs.source-digest }}
          EXPECTED_TAG_DIGEST: ${{ startsWith(github.ref, 'refs/tags/v') && needs.attest.outputs.tag-digest || needs.authorize-recovery-tag.outputs.tag-digest }}
          ALLOW_ROLLED_BACK_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate-finalize' && inputs.recover_rolled_back && '1' || '0' }}
        shell: bash
        run: |
          release_tag_not_trusted() {
            printf '{"code":"release-tag-not-trusted","message":"%s"}\n' "$1" >&2
            exit 1
          }
          recheck_release_tag() {
            current_tag_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq 'select(.object.type == "tag") | .object.sha') || \
              release_tag_not_trusted "release tag ref cannot be resolved"
            test -n "$current_tag_digest" && test "$current_tag_digest" = "$EXPECTED_TAG_DIGEST" || \
              release_tag_not_trusted "release tag object moved after attestation"
            current_source_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$EXPECTED_TAG_DIGEST" \
              --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha') || \
              release_tag_not_trusted "annotated release tag cannot be resolved"
            test -n "$current_source_digest" && test "$current_source_digest" = "$EXPECTED_SOURCE_DIGEST" || \
              release_tag_not_trusted "release tag source changed after attestation"
            is_draft=$(gh release view \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft) || \
              release_tag_not_trusted "GitHub release cannot be resolved"
            test "$is_draft" = true || \
              release_tag_not_trusted "GitHub release is no longer draft"
          }

          records="$RUNNER_TEMP/promotion-records"
          record="$RUNNER_TEMP/npm-promotion.json"
          asset_ids="$RUNNER_TEMP/npm-promotion-asset-ids"
          mkdir -p "$records"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | .assets[] | select(.name | startswith("npm-promotion-")) | .id' \
            > "$asset_ids"
          while read -r asset_id; do
            [ -n "$asset_id" ] || continue
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$records/${asset_id}.json"
          done < "$asset_ids"

          current=$(node npm/scripts/npm-promotion.cjs audit-records "$records" "$RELEASE_VERSION")
          current_file=$(printf '%s' "$current" | node -e '
            const value = JSON.parse(require("fs").readFileSync(0, "utf8"));
            process.stdout.write(value?.fileName ?? "");
          ')
          if [ -n "$current_file" ]; then
            cp "$records/$current_file" "$record"
          else
            node npm/scripts/npm-promotion.cjs create \
              "$RELEASE_VERSION" \
              "$record" \
              validated/npm/npm-artifacts.json
          fi

          checkpoint() {
            recheck_release_tag
            sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).record.sequence))' "$record")
            snapshot="$RUNNER_TEMP/npm-promotion-v${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${sequence}.json"
            cp "$record" "$snapshot"
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$snapshot"
          }
          recheck_release_tag
          record_status=$(node -e 'process.stdout.write(require(process.argv[1]).record.status)' "$record")
          if [ "$record_status" = conflicted ]; then
            node npm/scripts/npm-promotion.cjs restart "$record"
          elif [ "$record_status" = rolled_back ]; then
            test "$ALLOW_ROLLED_BACK_RECOVERY" = 1 || \
              release_tag_not_trusted "rolled-back promotion requires explicit recovery authorization"
            node npm/scripts/npm-promotion.cjs restart "$record" --allow-rolled-back
          fi
          checkpoint
          trap 'checkpoint' ERR
          max_advances=$(node -e 'process.stdout.write(String(require(process.argv[1]).record.packages.length))' "$record")
          advances=0
          while [ "$(node -e 'process.stdout.write(require(process.argv[1]).record.status)' "$record")" != complete ]; do
            before_sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).record.sequence))' "$record")
            recheck_release_tag
            node npm/scripts/npm-promotion.cjs advance "$record"
            after_sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).record.sequence))' "$record")
            test "$after_sequence" -gt "$before_sequence" || {
              echo "npm promotion sequence did not advance" >&2
              exit 1
            }
            advances=$((advances + 1))
            test "$advances" -le "$max_advances" || {
              echo "npm promotion exceeded its package count" >&2
              exit 1
            }
            checkpoint
          done
          trap - ERR
          node npm/scripts/npm-promotion.cjs verify-complete "$record"

      - name: Recheck signed tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_POLICY_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
          SATELLE_PROMOTION_RECORD_KEY: ${{ secrets.NPM_PROMOTION_RECORD_KEY }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && needs.collect.outputs.version || inputs.version }}
          EXPECTED_SOURCE_DIGEST: ${{ startsWith(github.ref, 'refs/tags/v') && needs.attest.outputs.source-digest || needs.authorize-recovery-tag.outputs.source-digest }}
          EXPECTED_TAG_DIGEST: ${{ startsWith(github.ref, 'refs/tags/v') && needs.attest.outputs.tag-digest || needs.authorize-recovery-tag.outputs.tag-digest }}
        shell: bash
        run: |
          release_tag_not_trusted() {
            printf '{"code":"release-tag-not-trusted","message":"%s"}\n' "$1" >&2
            exit 1
          }
          recheck_release_tag() {
            retry_mode=${1-}
            if ! current_tag_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq 'select(.object.type == "tag") | .object.sha')
            then
              if [ "$retry_mode" = retry_transient ]; then
                return 1
              fi
              release_tag_not_trusted "release tag ref cannot be resolved"
            fi
            test -n "$current_tag_digest" && test "$current_tag_digest" = "$EXPECTED_TAG_DIGEST" || \
              release_tag_not_trusted "release tag object moved after attestation"
            if ! current_source_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$EXPECTED_TAG_DIGEST" \
              --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha')
            then
              if [ "$retry_mode" = retry_transient ]; then
                return 1
              fi
              release_tag_not_trusted "annotated release tag cannot be resolved"
            fi
            test -n "$current_source_digest" && test "$current_source_digest" = "$EXPECTED_SOURCE_DIGEST" || \
              release_tag_not_trusted "release tag source changed after attestation"
          }

          release_asset_invalid() {
            printf '{"code":"release-asset-invalid","message":"%s"}\n' "$1" >&2
            exit 1
          }
          require_immutable_releases() {
            test -n "$RELEASE_POLICY_TOKEN" || \
              release_asset_invalid "immutable release policy token is not configured"
            immutable_releases=$(GH_TOKEN="$RELEASE_POLICY_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/immutable-releases" \
              --jq .enabled) || \
              release_asset_invalid "immutable release policy cannot be resolved"
            test "$immutable_releases" = true || \
              release_asset_invalid "immutable releases are not enabled"
          }
          recheck_release_tag
          downloaded="$RUNNER_TEMP/final-release-assets"
          records="$RUNNER_TEMP/final-promotion-records"
          expected_names="$RUNNER_TEMP/expected-release-asset-names"
          expected_manifest="$RUNNER_TEMP/expected-release-assets.sha256"
          candidate_ids="$RUNNER_TEMP/candidate-asset-ids"
          verified_assets="$RUNNER_TEMP/verified-release-assets"
          current_assets="$RUNNER_TEMP/current-release-assets"
          mkdir -p "$downloaded" "$records"
          : > "$expected_names"
          : > "$expected_manifest"
          : > "$candidate_ids"
          : > "$verified_assets"

          release_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq 'select(.draft == true and .immutable == false) | .id') || \
            release_asset_invalid "draft release identity cannot be resolved"
          printf '%s' "$release_id" | grep -Eq '^[1-9][0-9]*$' || \
            release_asset_invalid "release is not a mutable draft"

          static_files=(
            validated/tegami-validation.json
            validated/tegami-changelog-validation.json
            validated/release-orchestration.json
            validated/github/*
            validated/npm/npm-artifacts.json
          )
          for file in "${static_files[@]}"; do
            asset_name=$(basename "$file")
            digest=$(sha256sum "$file" | cut -d ' ' -f1)
            printf '%s\n' "$asset_name" >> "$expected_names"
            printf '%s  %s\n' "$digest" "$asset_name" >> "$expected_manifest"
          done
          LC_ALL=C sort -o "$expected_names" "$expected_names"

          version_pattern=${RELEASE_VERSION//./\\.}
          candidate_pattern="^npm-candidate-v${version_pattern}-[0-9]+-[0-9]+-[0-9]+\\.json$"
          promotion_pattern="^npm-promotion-v${version_pattern}-[0-9]+-[0-9]+-[0-9]+\\.json$"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r asset_id asset_name; do
                if grep -Fqx "$asset_name" "$expected_names"; then
                  gh api \
                    -H 'Accept: application/octet-stream' \
                    "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                    > "$downloaded/$asset_name"
                  printf '%s\t%s\n' "$asset_id" "$asset_name" >> "$verified_assets"
                elif [[ "$asset_name" =~ $candidate_pattern ]]; then
                  printf '%s\n' "$asset_id" >> "$candidate_ids"
                elif [[ "$asset_name" =~ $promotion_pattern ]]; then
                  gh api \
                    -H 'Accept: application/octet-stream' \
                    "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                    > "$records/$asset_name"
                  printf '%s\t%s\n' "$asset_id" "$asset_name" >> "$verified_assets"
                else
                  release_asset_invalid "release contains unrecognized asset $asset_name"
                fi
              done

          (cd "$downloaded" && sha256sum --check "$expected_manifest") || \
            release_asset_invalid "release asset digest does not match the validated candidate"
          current=$(node npm/scripts/npm-promotion.cjs audit-records "$records" "$RELEASE_VERSION")
          current_file=$(printf '%s' "$current" | node -e '
            const value = JSON.parse(require("fs").readFileSync(0, "utf8"));
            process.stdout.write(value?.fileName ?? "");
          ')
          test -n "$current_file" || \
            release_asset_invalid "release is missing its authenticated npm promotion record"
          node npm/scripts/npm-promotion.cjs verify-complete "$records/$current_file"

          recheck_release_tag
          while read -r asset_id; do
            [ -n "$asset_id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < "$candidate_ids"
          LC_ALL=C sort -o "$verified_assets" "$verified_assets"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | [.id, .name] | @tsv' \
            | LC_ALL=C sort > "$current_assets"
          cmp -s "$current_assets" "$verified_assets" || \
            release_asset_invalid "release asset set changed during final verification"
          require_immutable_releases
          publication_state=
          for attempt in $(seq 1 10); do
            if ! recheck_release_tag retry_transient; then
              test "$attempt" -lt 10 || \
                release_asset_invalid "release publication tag could not be rechecked"
              sleep 1
              continue
            fi
            if publication_state=$(gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false \
              -f make_latest=true)
            then
              break
            fi

            if publication_state=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$release_id")
            then
              if printf '%s' "$publication_state" | jq -e \
                --arg tag "$RELEASE_TAG" \
                --argjson id "$release_id" \
                '.id == $id and .tag_name == $tag and .draft == false and
                 (.immutable == true or .immutable == false)' \
                >/dev/null
              then
                break
              fi
              printf '%s' "$publication_state" | jq -e \
                --arg tag "$RELEASE_TAG" \
                --argjson id "$release_id" \
                '.id == $id and .tag_name == $tag and .draft == true and .immutable == false' \
                >/dev/null || \
                release_asset_invalid "release publication returned an invalid state"
            fi
            test "$attempt" -lt 10 || \
              release_asset_invalid "release publication state could not be reconciled"
            sleep 1
          done
          if printf '%s' "$publication_state" | jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .draft == false and .immutable == true' \
            >/dev/null
          then
            exit 0
          fi
          printf '%s' "$publication_state" | jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .draft == false and .immutable == false' \
            >/dev/null || \
            release_asset_invalid "release publication returned an invalid state"

          rollback_state=
          for attempt in $(seq 1 10); do
            if ! recheck_release_tag retry_transient; then
              test "$attempt" -lt 10 || \
                release_asset_invalid "release tag could not be rechecked for draft restoration"
              sleep 1
              continue
            fi
            if rollback_state=$(gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=true)
            then
              :
            elif rollback_state=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$release_id")
            then
              :
            else
              test "$attempt" -lt 10 || \
                release_asset_invalid "draft restoration state could not be reconciled"
              sleep 1
              continue
            fi

            if printf '%s' "$rollback_state" | jq -e \
              --arg tag "$RELEASE_TAG" \
              --argjson id "$release_id" \
              '.id == $id and .tag_name == $tag and .draft == true and .immutable == false' \
              >/dev/null
            then
              break
            fi
            printf '%s' "$rollback_state" | jq -e \
              --arg tag "$RELEASE_TAG" \
              --argjson id "$release_id" \
              '.id == $id and .tag_name == $tag and .draft == false and .immutable == false' \
              >/dev/null || \
              release_asset_invalid "draft restoration returned an invalid state"
            test "$attempt" -lt 10 || \
              release_asset_invalid "mutable release could not be restored to draft"
            sleep 1
          done
          printf '%s' "$rollback_state" | jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .draft == true and .immutable == false' \
            >/dev/null || \
            release_asset_invalid "mutable release remained public after draft restoration"
          release_asset_invalid "published release was not immutable and was restored to draft"

  authorize-recovery-tag:
    name: Authorize signed tag recovery
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source-digest: ${{ steps.tag.outputs.source-digest }}
      tag-digest: ${{ steps.tag.outputs.tag-digest }}
    steps:
      - name: Resolve verified signed recovery tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          release_tag_not_trusted() {
            printf '{"code":"release-tag-not-trusted","message":"%s"}\n' "$1" >&2
            exit 1
          }

          printf '%s' "$RELEASE_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || \
            release_tag_not_trusted "recovery version is invalid"
          if ! tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq '.object.type + " " + .object.sha'); then
            release_tag_not_trusted "release tag ref cannot be resolved"
          fi
          test "${tag_ref%% *}" = tag || \
            release_tag_not_trusted "release tag is not annotated"
          tag_digest=${tag_ref#* }
          if ! source_digest=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_digest" --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha'); then
            release_tag_not_trusted "annotated release tag cannot be resolved"
          fi
          test -n "$source_digest" || \
            release_tag_not_trusted "release tag signature is not GitHub-verified"
          if ! default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch); then
            release_tag_not_trusted "default branch cannot be resolved"
          fi
          if ! default_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$default_branch" --jq .object.sha); then
            release_tag_not_trusted "default branch head cannot be resolved"
          fi
          test "$GITHUB_REF" = "refs/heads/$default_branch" || \
            release_tag_not_trusted "release recovery must be dispatched from the default branch"
          test "$GITHUB_SHA" = "$default_head" || \
            release_tag_not_trusted "default branch moved after recovery started"
          if ! compare_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/${source_digest}...${default_head}" --jq .status); then
            release_tag_not_trusted "release tag commit cannot be compared with the default branch"
          fi
          if [ "$compare_status" != identical ] && [ "$compare_status" != ahead ]; then
            release_tag_not_trusted "release tag does not point at a commit on the default branch"
          fi
          if ! release_pr_count=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$source_digest/pulls" \
            | jq \
              --arg branch "$default_branch" \
              --arg sha "$source_digest" \
              '[.[] | select(.merged_at != null and .base.ref == $branch and .merge_commit_sha == $sha)] | length'); then
            release_tag_not_trusted "release pull request provenance cannot be resolved"
          fi
          test "$release_pr_count" = 1 || \
            release_tag_not_trusted "release tag commit was not produced by one merged release pull request"
          printf 'source-digest=%s\n' "$source_digest" >> "$GITHUB_OUTPUT"
          printf 'tag-digest=%s\n' "$tag_digest" >> "$GITHUB_OUTPUT"

  resume-candidates:
    name: Resume npm candidate publication
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate-resume'
    needs: authorize-recovery-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: npm-candidate-publication-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      SATELLE_RELEASE_RECOVERY: "1"
      SATELLE_RELEASE_RECOVERY_OPERATION: candidate-resume
      SATELLE_RELEASE_RECOVERY_SOURCE_ROOT: ${{ github.workspace }}/signed-release-source
      SATELLE_RELEASE_RECOVERY_TAG: v${{ inputs.version }}
    steps:
      - name: Check out current release recovery code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check out signed release metadata
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: signed-release-source
          ref: ${{ needs.authorize-recovery-tag.outputs.source-digest }}

      - name: Install Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm CLI
        shell: bash
        run: |
          npm install --global npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Install recovery provenance signer
        run: npm ci --ignore-scripts

      - name: Download the exact signed-tag candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_DIGEST: ${{ needs.authorize-recovery-tag.outputs.source-digest }}
        shell: bash
        run: |
          recovery_source_not_trusted() {
            jq -cn \
              --arg message "$1" \
              '{code:"recovery-source-not-trusted", message:$message}' >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || \
            recovery_source_not_trusted "checked out commit does not match the dispatch commit"
          tag="v${RELEASE_VERSION}"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || \
            recovery_source_not_trusted "GitHub release is not draft"
          source_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&branch=v${RELEASE_VERSION}&per_page=100")
          source_run_ids=$(printf '%s' "$source_runs" | jq -c \
            --arg source_digest "$VERIFIED_SOURCE_DIGEST" \
            --arg tag "$tag" \
            '[.workflow_runs[] | select(
              .head_branch == $tag and
              .head_sha == $source_digest and
              .event == "push" and
              .status == "completed" and
              .conclusion == "failure"
            ) | .id]')
          source_run_count=$(printf '%s' "$source_run_ids" | jq -r 'length')
          test "$source_run_count" = 1 || \
            recovery_source_not_trusted "expected one failed signed-tag run; found ${source_run_count}"
          source_run_id=$(printf '%s' "$source_run_ids" | jq -r '.[0]')
          gh run download "$source_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name validated-release-candidate \
            --dir validated

      - name: Publish native, scoped, then unscoped candidate packages
        id: publish-recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_DIGEST: ${{ needs.authorize-recovery-tag.outputs.source-digest }}
          VERIFIED_TAG_DIGEST: ${{ needs.authorize-recovery-tag.outputs.tag-digest }}
        shell: bash
        run: |
          recheck_recovery_authorization() {
            current_tag_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/v${RELEASE_VERSION}" \
              --jq 'select(.object.type == "tag") | .object.sha')
            test -n "$current_tag_digest" && test "$current_tag_digest" = "$VERIFIED_TAG_DIGEST"
            current_source_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$VERIFIED_TAG_DIGEST" \
              --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha')
            test -n "$current_source_digest" && test "$current_source_digest" = "$VERIFIED_SOURCE_DIGEST"
            test "$(gh release view "v${RELEASE_VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft)" = true
          }

          record="$RUNNER_TEMP/npm-candidate-publication.json"
          checkpoint() {
            recheck_recovery_authorization
            sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).sequence))' "$record")
            snapshot="$RUNNER_TEMP/npm-candidate-v${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${sequence}.json"
            cp "$record" "$snapshot"
            gh release upload "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --clobber "$snapshot"
          }
          node npm/scripts/npm-candidate-publication.cjs create \
            "$RELEASE_VERSION" \
            validated/npm/npm-artifacts.json \
            "$record"
          checkpoint
          node npm/scripts/npm-candidate-publication.cjs reconcile "$record"
          checkpoint
          max_advances=$(node -e 'process.stdout.write(String(require(process.argv[1]).packages.length))' "$record")
          advances=0
          while [ "$(node -e 'process.stdout.write(require(process.argv[1]).status)' "$record")" != complete ]; do
            before_sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).sequence))' "$record")
            recheck_recovery_authorization
            node npm/scripts/npm-candidate-publication.cjs advance "$record" validated/npm
            after_sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).sequence))' "$record")
            test "$after_sequence" -gt "$before_sequence" || {
              echo "candidate publication sequence did not advance" >&2
              exit 1
            }
            advances=$((advances + 1))
            test "$advances" -le "$max_advances" || {
              echo "candidate publication exceeded its package count" >&2
              exit 1
            }
            checkpoint
          done

      - name: Preserve failed npm recovery record
        if: failure() && steps.publish-recovery.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-candidate-recovery-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-candidate-publication.json
          if-no-files-found: error
          retention-days: 30

  repair-candidate-tags:
    name: Repair missing npm candidate tags
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate-tag-repair'
    needs: authorize-recovery-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SATELLE_RELEASE_RECOVERY: "1"
      SATELLE_RELEASE_RECOVERY_TAG: v${{ inputs.version }}
    steps:
      - name: Check out matching release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.authorize-recovery-tag.outputs.source-digest }}

      - name: Install Node.js for npm dist-tag recovery
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm CLI
        run: npm install --global npm@11.5.1

      - name: Download validated npm manifest from draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          printf '%s' "$RELEASE_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tag="v${RELEASE_VERSION}"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          mkdir -p validated/npm
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern npm-artifacts.json \
            --dir validated/npm

      - name: Repair candidate dist-tags
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_DIGEST: ${{ needs.authorize-recovery-tag.outputs.source-digest }}
          VERIFIED_TAG_DIGEST: ${{ needs.authorize-recovery-tag.outputs.tag-digest }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SOURCE_DIGEST"
          current_tag_digest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${RELEASE_VERSION}" --jq .object.sha)
          test "$current_tag_digest" = "$VERIFIED_TAG_DIGEST"
          current_source_digest=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$current_tag_digest" \
            --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha')
          test "$current_source_digest" = "$VERIFIED_SOURCE_DIGEST"
          node npm/scripts/npm-candidate-publication.cjs repair-tags \
            "$RELEASE_VERSION" \
            validated/npm/npm-artifacts.json

  rollback-promotion:
    name: Roll back an incomplete npm promotion
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
    needs: authorize-recovery-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SATELLE_RELEASE_RECOVERY: "1"
      SATELLE_RELEASE_RECOVERY_OPERATION: rollback
      SATELLE_RELEASE_RECOVERY_TAG: v${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.authorize-recovery-tag.outputs.source-digest }}

      - name: Install Node.js for npm dist-tag recovery
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm CLI
        run: npm install --global npm@11.5.1

      - name: Restore prior latest tags in reverse dependency order
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          SATELLE_PROMOTION_RECORD_KEY: ${{ secrets.NPM_PROMOTION_RECORD_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_DIGEST: ${{ needs.authorize-recovery-tag.outputs.source-digest }}
          VERIFIED_TAG_DIGEST: ${{ needs.authorize-recovery-tag.outputs.tag-digest }}
        shell: bash
        run: |
          printf '%s' "$RELEASE_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tag="v${RELEASE_VERSION}"
          test "$(git rev-parse HEAD)" = "$VERIFIED_SOURCE_DIGEST"
          recovery_not_authorized() {
            printf '{"code":"release-recovery-not-authorized","message":"%s"}\n' "$1" >&2
            exit 1
          }
          recheck_recovery_authorization() {
            current_tag_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq 'select(.object.type == "tag") | .object.sha') || \
              recovery_not_authorized "release tag ref cannot be resolved"
            test -n "$current_tag_digest" && test "$current_tag_digest" = "$VERIFIED_TAG_DIGEST" || \
              recovery_not_authorized "release tag object moved after recovery authorization"
            current_source_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$VERIFIED_TAG_DIGEST" \
              --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha') || \
              recovery_not_authorized "annotated release tag cannot be resolved"
            test -n "$current_source_digest" && test "$current_source_digest" = "$VERIFIED_SOURCE_DIGEST" || \
              recovery_not_authorized "release tag source changed after recovery authorization"
            is_draft=$(gh release view \
              "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft) || \
              recovery_not_authorized "GitHub release cannot be resolved"
            test "$is_draft" = true || \
              recovery_not_authorized "GitHub release is no longer draft"
          }
          recheck_recovery_authorization
          records="$RUNNER_TEMP/promotion-records"
          record="$RUNNER_TEMP/npm-promotion.json"
          asset_ids="$RUNNER_TEMP/npm-promotion-asset-ids"
          mkdir -p "$records"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == true) | .assets[] | select(.name | startswith("npm-promotion-")) | .id' \
            > "$asset_ids"
          while read -r asset_id; do
            [ -n "$asset_id" ] || continue
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$records/${asset_id}.json"
          done < "$asset_ids"
          current=$(node npm/scripts/npm-promotion.cjs audit-records "$records" "$RELEASE_VERSION")
          current_file=$(printf '%s' "$current" | node -e '
            const value = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (!value?.fileName) process.exit(1);
            process.stdout.write(value.fileName);
          ')
          cp "$records/$current_file" "$record"
          node npm/scripts/npm-promotion.cjs abort "$record"

          checkpoint() {
            sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).record.sequence))' "$record")
            snapshot="$RUNNER_TEMP/npm-promotion-v${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${sequence}.json"
            cp "$record" "$snapshot"
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$snapshot"
          }
          checkpoint
          trap 'checkpoint' ERR
          max_advances=$(node -e 'process.stdout.write(String(require(process.argv[1]).record.packages.length))' "$record")
          advances=0
          while [ "$(node -e 'process.stdout.write(require(process.argv[1]).record.status)' "$record")" != rolled_back ]; do
            before_sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).record.sequence))' "$record")
            recheck_recovery_authorization
            node npm/scripts/npm-promotion.cjs advance "$record"
            after_sequence=$(node -e 'process.stdout.write(String(require(process.argv[1]).record.sequence))' "$record")
            test "$after_sequence" -gt "$before_sequence" || {
              echo "npm rollback sequence did not advance" >&2
              exit 1
            }
            advances=$((advances + 1))
            test "$advances" -le "$max_advances" || {
              echo "npm rollback exceeded its package count" >&2
              exit 1
            }
            checkpoint
          done
          trap - ERR

name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "npm/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/install.ps1"
      - "scripts/install.sh"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      operation:
        description: Non-publishing diagnostic or post-approval finalization
        required: true
        type: choice
        default: diagnostics
        options:
          - diagnostics
          - stage-finalize
      version:
        description: Existing release version for recovery
        required: false
        type: string
concurrency:
  group: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'stage-finalize')) && 'satelle-release-writer' || format('release-candidate-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'diagnostics'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64-gnu
            rust-target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            executable: satelle
            glibc-version: "2.17"
          - target: linux-x64-gnu
            rust-target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            executable: satelle
            glibc-version: "2.17"
          - target: darwin-arm64
            rust-target: aarch64-apple-darwin
            runner: macos-15
            executable: satelle
            glibc-version: ""
          - target: darwin-x64
            rust-target: x86_64-apple-darwin
            runner: macos-15-intel
            executable: satelle
            glibc-version: ""
          - target: win32-arm64-msvc
            rust-target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            executable: satelle.exe
            glibc-version: ""
          - target: win32-x64-msvc
            rust-target: x86_64-pc-windows-msvc
            runner: windows-2025
            executable: satelle.exe
            glibc-version: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Rust target
        shell: bash
        run: rustup toolchain install 1.97.0 --profile minimal --target "${{ matrix.rust-target }}"

      - name: Install pinned GNU cross-build toolchain
        if: matrix.glibc-version != ''
        shell: bash
        run: |
          # cargo-zigbuild v0.23.0 and Zig 0.15.2 keep GNU artifacts on one reviewed ABI path.
          tool_root="$RUNNER_TEMP/satelle-gnu-toolchain"
          mkdir -p "$tool_root"
          case "$RUNNER_ARCH" in
            ARM64)
              host_arch=aarch64
              cargo_zigbuild_sha=5917d5416884cba0f23c2653016f7f2df2ec04e74eb6b259598fecc066f8c429
              zig_sha=958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f
              ;;
            X64)
              host_arch=x86_64
              cargo_zigbuild_sha=c636e4f72b6f40a40ddf0414c8c6056f78b87eea3be0edf01f08d65fa028a373
              zig_sha=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
              ;;
            *)
              echo "unsupported GNU build runner architecture: $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac

          cargo_zigbuild_archive="cargo-zigbuild-${host_arch}-unknown-linux-gnu.tar.xz"
          zig_archive="zig-${host_arch}-linux-0.15.2.tar.xz"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 300 \
            --output "$tool_root/$cargo_zigbuild_archive" \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.0/$cargo_zigbuild_archive"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 300 \
            --output "$tool_root/$zig_archive" \
            "https://ziglang.org/download/0.15.2/$zig_archive"
          printf '%s  %s\n' "$cargo_zigbuild_sha" "$tool_root/$cargo_zigbuild_archive" \
            | sha256sum --check --strict
          printf '%s  %s\n' "$zig_sha" "$tool_root/$zig_archive" \
            | sha256sum --check --strict
          timeout 300 tar -xJf "$tool_root/$cargo_zigbuild_archive" -C "$tool_root"
          timeout 300 tar -xJf "$tool_root/$zig_archive" -C "$tool_root"
          printf '%s\n' \
            "$tool_root/cargo-zigbuild-${host_arch}-unknown-linux-gnu" \
            "$tool_root/zig-${host_arch}-linux-0.15.2" \
            >> "$GITHUB_PATH"

      - name: Build GNU release executable
        if: matrix.glibc-version != ''
        shell: bash
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_PROFILE_RELEASE_DEBUG: 0
          RUSTFLAGS: -D warnings
        run: >-
          cargo zigbuild --locked --release -p satelle
          --target "${{ matrix.rust-target }}.${{ matrix.glibc-version }}"

      - name: Build native release executable
        if: matrix.glibc-version == ''
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_PROFILE_RELEASE_DEBUG: 0
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo build --locked --release -p satelle --target ${{ matrix.rust-target }}

      - name: Verify GNU ABI floor
        if: matrix.glibc-version != ''
        shell: bash
        run: |
          binary="target/${{ matrix.rust-target }}/release/${{ matrix.executable }}"
          maximum_glibc=$(
            readelf --version-info "$binary" \
              | grep -Eo 'GLIBC_[0-9.]+' \
              | sed 's/^GLIBC_//' \
              | sort -V \
              | tail -n 1
          )
          test -n "$maximum_glibc"
          glibc_floor=${{ matrix.glibc-version }}
          if [ "$(printf '%s\n%s\n' "$glibc_floor" "$maximum_glibc" | sort -V | tail -n 1)" != "$glibc_floor" ]; then
            echo "GNU artifact requires GLIBC_$maximum_glibc, newer than GLIBC_$glibc_floor" >&2
            exit 1
          fi

      - name: Stage native npm package
        shell: bash
        run: |
          mkdir -p dist
          node npm/scripts/release.cjs stage-native \
            "${{ matrix.target }}" \
            "target/${{ matrix.rust-target }}/release/${{ matrix.executable }}" \
            dist

      - name: Create Unix release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=$(node npm/scripts/release.cjs check | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          tar -czf "dist/satelle-v${version}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.rust-target }}/release" satelle

      - name: Create Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = (node npm/scripts/release.cjs check | ConvertFrom-Json).version
          Compress-Archive `
            -LiteralPath "target/${{ matrix.rust-target }}/release/satelle.exe" `
            -DestinationPath "dist/satelle-v$Version-${{ matrix.target }}.zip"

      - name: Upload target artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  collect:
    name: Validate release graph and publish dry-runs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Install npm workspace
        run: npm ci --ignore-scripts

      - name: Install pinned Tegami release tooling
        run: npm ci --prefix npm/release-tooling --ignore-scripts

      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Read canonical release plan
        id: plan
        shell: bash
        run: |
          version=$(node npm/scripts/release.cjs check | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Stage top-level npm packages
        run: node npm/scripts/release.cjs stage-launchers dist

      - name: Validate npm package graph
        run: node npm/scripts/release.cjs validate-npm-artifacts dist --write-manifest

      - name: Validate native archives and create SHA256SUMS
        run: node npm/scripts/release.cjs validate-native-release-archives dist validated

      - name: Package the crates.io artifact
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        shell: bash
        run: |
          cargo package --locked -p satelle
          crate_name="satelle-${RELEASE_VERSION}.crate"
          mkdir -p validated/cargo
          cp "target/package/$crate_name" "validated/cargo/$crate_name"
          (cd validated/cargo && sha256sum "$crate_name" > "$crate_name.sha256")

      - name: Validate Tegami Cargo release behavior
        id: tegami
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        shell: bash
        run: |
          error_log="$RUNNER_TEMP/tegami-validation.stderr"
          set +e
          npm run dry-run --prefix npm/release-tooling --silent \
            > validated/tegami-validation.json \
            2> "$error_log" && \
            SATELLE_TEGAMI_RELEASE_VERSION="$RELEASE_VERSION" \
              npm run tegami --prefix npm/release-tooling -- publish \
              >> "$error_log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            node npm/scripts/release-tooling-gate.cjs record-failure \
              validated/tegami-validation.json
          fi
          exit "$status"

      - name: Select reviewed release orchestration
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          TEGAMI_OUTCOME: ${{ steps.tegami.outcome }}
        run: |
          node npm/scripts/release-tooling-gate.cjs select \
            "$RELEASE_VERSION" \
            "$TEGAMI_OUTCOME" \
            validated/tegami-validation.json \
            npm/release-tooling/manual-release.json \
            validated/release-orchestration.json

      - name: Verify committed Tegami changelog output
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node npm/scripts/release-tooling-gate.cjs verify-changelogs \
            "$RELEASE_VERSION" \
            validated/tegami-changelog-validation.json

      - name: Complete validated npm publication set
        shell: bash
        run: |
          cp \
            ./dist/npm-satelle-scoped.tgz \
            ./dist/npm-satelle-unscoped.tgz \
            ./dist/npm-artifacts.json \
            validated/npm/
          chmod 400 validated/npm/*
          chmod 500 validated/npm validated

      - name: Run npm package dry-runs sequentially
        shell: bash
        run: |
          for package in \
            ./validated/npm/npm-linux-arm64-gnu.tgz \
            ./validated/npm/npm-linux-x64-gnu.tgz \
            ./validated/npm/npm-darwin-arm64.tgz \
            ./validated/npm/npm-darwin-x64.tgz \
            ./validated/npm/npm-win32-arm64-msvc.tgz \
            ./validated/npm/npm-win32-x64-msvc.tgz \
            ./dist/npm-satelle-scoped.tgz \
            ./dist/npm-satelle-unscoped.tgz
          do
            npm pack "$package" --dry-run --ignore-scripts
          done

      - name: Upload validated release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release-candidate
          path: validated
          if-no-files-found: error

  attest:
    name: Attest signed-tag release candidate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [collect, lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      source-digest: ${{ steps.tag.outputs.source-digest }}
      tag-digest: ${{ steps.tag.outputs.tag-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-candidate
          path: validated

      - name: Resolve verified signed tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.collect.outputs.version }}
        shell: bash
        run: |
          release_tag_not_trusted() {
            printf '{"code":"release-tag-not-trusted","message":"%s"}\n' "$1" >&2
            exit 1
          }

          test "$GITHUB_REF_NAME" = "v${RELEASE_VERSION}" || \
            release_tag_not_trusted "release tag does not match the validated version"
          if ! tag_ref=$(gh api "repos/${{ github.repository }}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type + " " + .object.sha'); then
            release_tag_not_trusted "release tag ref cannot be resolved"
          fi
          test "${tag_ref%% *}" = tag || \
            release_tag_not_trusted "release tag is not annotated"
          tag_digest=${tag_ref#* }
          if ! source_digest=$(gh api "repos/${{ github.repository }}/git/tags/$tag_digest" --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha'); then
            release_tag_not_trusted "annotated release tag cannot be resolved"
          fi
          test -n "$source_digest" || \
            release_tag_not_trusted "release tag signature is not GitHub-verified"
          if ! default_branch=$(gh api "repos/${{ github.repository }}" --jq .default_branch); then
            release_tag_not_trusted "default branch cannot be resolved"
          fi
          if ! default_head=$(gh api "repos/${{ github.repository }}/git/ref/heads/$default_branch" --jq .object.sha); then
            release_tag_not_trusted "default branch head cannot be resolved"
          fi
          if ! compare_status=$(gh api "repos/${{ github.repository }}/compare/${source_digest}...${default_head}" --jq .status); then
            release_tag_not_trusted "release tag commit cannot be compared with the default branch"
          fi
          test "$source_digest" = "$GITHUB_SHA" || \
            release_tag_not_trusted "release tag moved after the workflow started"
          if [ "$compare_status" != identical ] && [ "$compare_status" != ahead ]; then
            release_tag_not_trusted "release tag does not point at a commit on the default branch"
          fi
          if ! release_pr_count=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${{ github.repository }}/commits/$source_digest/pulls" \
            | jq \
              --arg branch "$default_branch" \
              --arg sha "$source_digest" \
              '[.[] | select(.merged_at != null and .base.ref == $branch and .merge_commit_sha == $sha)] | length'); then
            release_tag_not_trusted "release pull request provenance cannot be resolved"
          fi
          test "$release_pr_count" = 1 || \
            release_tag_not_trusted "release tag commit was not produced by one merged release pull request"
          printf 'source-digest=%s\n' "$source_digest" >> "$GITHUB_OUTPUT"
          printf 'tag-digest=%s\n' "$tag_digest" >> "$GITHUB_OUTPUT"

      - name: Attest every native archive
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: validated/github/satelle-*

      - name: Verify archive attestations against canonical policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.collect.outputs.version }}
          SOURCE_DIGEST: ${{ steps.tag.outputs.source-digest }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        shell: bash
        run: |
          for archive in validated/github/satelle-*; do
            node npm/scripts/release.cjs verify-release-attestation \
              "$archive" \
              "$RELEASE_VERSION" \
              "$SOURCE_DIGEST" \
              "$ATTESTATION_BUNDLE"
          done

      - name: Attest the Cargo package
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: validated/cargo/satelle-*.crate

  lifecycle:
    name: Install, upgrade, smoke, and uninstall ${{ matrix.target }}
    needs: collect
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-arm64-msvc
            runner: windows-11-arm
          - target: win32-x64-msvc
            runner: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-candidate
          path: validated

      - name: Validate Unix archive lifecycle
        if: runner.os != 'Windows'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.collect.outputs.version }}
        shell: bash
        run: |
          checkout_root=$PWD
          release_root=$(cd validated/github && pwd)
          archive="satelle-v${RELEASE_VERSION}-${RELEASE_TARGET}.tar.gz"
          cd "$release_root"
          if command -v sha256sum >/dev/null 2>&1; then
            grep "  ${archive}$" SHA256SUMS | sha256sum -c -
          else
            grep "  ${archive}$" SHA256SUMS | shasum -a 256 -c -
          fi
          extract_root=$(mktemp -d)
          install_root=$(mktemp -d)
          command_root=$(mktemp -d)
          policy_log=$(mktemp)
          trap 'rm -rf "$extract_root" "$install_root" "$command_root"; rm -f "$policy_log"' EXIT
          tar -xzf "$archive" -C "$extract_root"
          printf old > "$install_root/satelle"
          cp "$extract_root/satelle" "$install_root/satelle"
          chmod 755 "$install_root/satelle"
          test "$("$install_root/satelle" --version)" = "satelle $RELEASE_VERSION"
          test "$("$install_root/satelle" paths --json | jq -r .schema_version)" = satelle.paths.v2
          rm "$install_root/satelle"
          test ! -e "$install_root/satelle"

          cat > "$command_root/curl" <<'SH'
          #!/bin/sh
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -o) destination=$2; shift 2 ;;
              http*) source_url=$1; shift ;;
              *) shift ;;
            esac
          done
          cp "$SATELLE_RELEASE_FIXTURES/${source_url##*/}" "$destination"
          SH
          cat > "$command_root/gh" <<'SH'
          #!/bin/sh
          printf '%s\n' "$*" >> "$SATELLE_POLICY_LOG"
          if [ "$1" = api ]; then
            case "$2" in
              */git/ref/tags/*) printf '%s\n' 'tag bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' ;;
              */git/tags/*) printf '%s\n' 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' ;;
            esac
          fi
          SH
          chmod 755 "$command_root/curl" "$command_root/gh"
          export PATH="$command_root:$PATH"
          export SATELLE_RELEASE_FIXTURES="$release_root"
          export SATELLE_POLICY_LOG="$policy_log"

          script_install_root=$(mktemp -d)
          trap 'rm -rf "$extract_root" "$install_root" "$command_root" "$script_install_root"; rm -f "$policy_log"' EXIT
          "$checkout_root/scripts/install.sh" --version "$RELEASE_VERSION" --bin-dir "$script_install_root"
          printf old > "$script_install_root/satelle"
          : > "$policy_log"
          "$checkout_root/scripts/install.sh" --version "$RELEASE_VERSION" --bin-dir "$script_install_root"
          test "$("$script_install_root/satelle" --version)" = "satelle $RELEASE_VERSION"
          test "$(jq -r .target "$script_install_root/.satelle-install.json")" = "$RELEASE_TARGET"
          grep -q -- '--deny-self-hosted-runners' "$policy_log"
          "$checkout_root/scripts/install.sh" --uninstall --bin-dir "$script_install_root"
          test ! -e "$script_install_root/satelle"
          test ! -e "$script_install_root/.satelle-install.json"

      - name: Validate Windows archive lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "${{ needs.collect.outputs.version }}"
          $Archive = "satelle-v$Version-${{ matrix.target }}.zip"
          $ReleaseRoot = Resolve-Path "validated/github"
          $Entry = Get-Content "$ReleaseRoot/SHA256SUMS" | Where-Object { $_ -match "^([0-9a-f]{64})  $([regex]::Escape($Archive))$" }
          if (@($Entry).Count -ne 1) { throw "missing canonical checksum for $Archive" }
          $Digest = (Get-FileHash "$ReleaseRoot/$Archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Digest -ne $Entry.Substring(0, 64)) { throw "checksum mismatch for $Archive" }
          $ExtractRoot = Join-Path $env:RUNNER_TEMP "satelle-extract"
          $InstallRoot = Join-Path $env:RUNNER_TEMP "satelle-install"
          New-Item -ItemType Directory -Path $InstallRoot -Force | Out-Null
          Expand-Archive "$ReleaseRoot/$Archive" $ExtractRoot
          Set-Content "$InstallRoot/satelle.exe" "old"
          Copy-Item "$ExtractRoot/satelle.exe" "$InstallRoot/satelle.exe" -Force
          if ((& "$InstallRoot/satelle.exe" --version) -ne "satelle $Version") { throw "version smoke failed" }
          $Paths = & "$InstallRoot/satelle.exe" paths --json | ConvertFrom-Json
          if ($Paths.schema_version -ne "satelle.paths.v2") { throw "paths smoke failed" }
          Remove-Item "$InstallRoot/satelle.exe"
          if (Test-Path "$InstallRoot/satelle.exe") { throw "uninstall failed" }

      - name: Validate Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "${{ needs.collect.outputs.version }}"
          $FixtureRoot = (Resolve-Path "validated/github").Path
          $InstallRoot = Join-Path $env:RUNNER_TEMP "satelle-script-install"
          $PolicyLog = Join-Path $env:RUNNER_TEMP "satelle-gh-policy.log"
          $CommandRoot = Join-Path $env:RUNNER_TEMP "satelle-installer-commands"
          New-Item -ItemType Directory -Path $CommandRoot -Force | Out-Null
          $env:SATELLE_POLICY_LOG = $PolicyLog
          $env:PATH = "$CommandRoot;$env:PATH"
          @'
          @echo off
          echo %*>>"%SATELLE_POLICY_LOG%"
          echo %~2| findstr /C:"/git/ref/tags/" >nul && echo {"object":{"type":"tag","sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}} && exit /b 0
          echo %~2| findstr /C:"/git/tags/" >nul && echo {"verification":{"verified":true},"object":{"type":"commit","sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}} && exit /b 0
          echo [{}]
          '@ | Set-Content -LiteralPath (Join-Path $CommandRoot "gh.cmd") -Encoding ascii
          function global:Invoke-WebRequest {
            param(
              [string]$Uri,
              [string]$OutFile,
              [int]$ConnectionTimeoutSeconds,
              [int]$OperationTimeoutSeconds
            )
            if ($ConnectionTimeoutSeconds -ne 10 -or $OperationTimeoutSeconds -ne 300) {
              throw "installer HTTP timeout policy mismatch"
            }
            Copy-Item -LiteralPath (Join-Path $FixtureRoot ([System.IO.Path]::GetFileName($Uri))) -Destination $OutFile
          }
          & scripts/install.ps1 -Version $Version -BinDir $InstallRoot
          Set-Content -LiteralPath (Join-Path $InstallRoot "satelle.exe") -Value old
          Clear-Content -LiteralPath $PolicyLog
          & scripts/install.ps1 -Version $Version -BinDir $InstallRoot
          if ((& (Join-Path $InstallRoot "satelle.exe") --version) -ne "satelle $Version") { throw "installer upgrade failed" }
          $Receipt = Get-Content (Join-Path $InstallRoot ".satelle-install.json") | ConvertFrom-Json
          if ($Receipt.version -ne $Version -or $Receipt.target -ne "${{ matrix.target }}") { throw "installer receipt mismatch" }
          if ((Get-Content $PolicyLog -Raw) -notmatch "--deny-self-hosted-runners") { throw "attestation policy was not invoked" }
          & scripts/install.ps1 -Uninstall -BinDir $InstallRoot
          if (Test-Path (Join-Path $InstallRoot "satelle.exe")) { throw "installer uninstall failed" }

  draft-release:
    name: Create authenticated draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attest, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-candidate
          path: validated

      - name: Create or update draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.collect.outputs.version }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Satelle v${RELEASE_VERSION}" \
              --generate-notes
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            validated/tegami-validation.json \
            validated/tegami-changelog-validation.json \
            validated/release-orchestration.json \
            validated/cargo/* \
            validated/github/* \
            validated/npm/npm-artifacts.json
          expected_assets=$(
            {
              find validated/cargo -maxdepth 1 -type f -printf '%f\n'
              find validated/github -maxdepth 1 -type f -printf '%f\n'
              printf '%s\n' \
                npm-artifacts.json \
                release-orchestration.json \
                tegami-changelog-validation.json \
                tegami-validation.json
            } | LC_ALL=C sort
          )
          version_pattern=${RELEASE_VERSION//./\\.}
          stage_pattern="^npm-stages-v${version_pattern}\\.json$"
          actual_assets=$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' \
              | while IFS= read -r asset_name; do
                  if [[ "$asset_name" =~ $stage_pattern ]]; then
                    continue
                  fi
                  printf '%s\n' "$asset_name"
                done \
              | LC_ALL=C sort
          )
          if [ "$actual_assets" != "$expected_assets" ]; then
            printf '%s\n' "release asset set does not match the validated artifact set" >&2
            exit 1
          fi

  publish-cargo:
    name: Publish the crates.io package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attest, collect, draft-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-candidate
          path: validated

      - name: Publish or verify the immutable Cargo version
        env:
          CARGO_HTTP_USER_AGENT: OpenAI File Downloader, XaiImageApiFetch/1.0
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          EXPECTED_SOURCE_DIGEST: ${{ needs.attest.outputs.source-digest }}
          EXPECTED_TAG_DIGEST: ${{ needs.attest.outputs.tag-digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.collect.outputs.version }}
        shell: bash
        run: |
          cargo_publish_error() {
            printf '{"code":"%s","message":"%s"}\n' "$1" "$2" >&2
            exit 1
          }
          current_tag_digest=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq 'select(.object.type == "tag") | .object.sha') || \
            cargo_publish_error release-tag-not-trusted "release tag ref cannot be resolved"
          test -n "$current_tag_digest" && test "$current_tag_digest" = "$EXPECTED_TAG_DIGEST" || \
            cargo_publish_error release-tag-not-trusted "release tag object moved after attestation"
          current_source_digest=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$EXPECTED_TAG_DIGEST" \
            --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha') || \
            cargo_publish_error release-tag-not-trusted "annotated release tag cannot be resolved"
          test -n "$current_source_digest" && test "$current_source_digest" = "$EXPECTED_SOURCE_DIGEST" || \
            cargo_publish_error release-tag-not-trusted "release tag source changed after attestation"

          crate_name="satelle-${RELEASE_VERSION}.crate"
          expected="validated/cargo/$crate_name"
          (cd validated/cargo && sha256sum --check --strict "$crate_name.sha256") || \
            cargo_publish_error cargo-package-digest-mismatch "validated Cargo package checksum failed"
          registry="$RUNNER_TEMP/registry.crate"
          download="https://crates.io/api/v1/crates/satelle/${RELEASE_VERSION}/download"
          status=$(curl --silent --show-error --location \
            --user-agent 'OpenAI File Downloader, XaiImageApiFetch/1.0' \
            --output "$registry" \
            --write-out '%{http_code}' \
            "$download") || \
            cargo_publish_error cargo-registry-unavailable "crates.io version lookup failed"
          case "$status" in
            200)
              cmp --silent "$expected" "$registry" || \
                cargo_publish_error cargo-registry-version-conflict "crates.io already has different package bytes for this version"
              ;;
            404)
              test -n "$CARGO_REGISTRY_TOKEN" || \
                cargo_publish_error cargo-publish-token-missing "CARGO_REGISTRY_TOKEN is not configured"
              # The exact archive already passed cargo package verification in collect.
              cargo publish --locked --no-verify -p satelle
              for attempt in $(seq 1 20); do
                status=$(curl --silent --show-error --location \
                  --user-agent 'OpenAI File Downloader, XaiImageApiFetch/1.0' \
                  --output "$registry" \
                  --write-out '%{http_code}' \
                  "$download") || continue
                if [ "$status" = 200 ]; then
                  cmp --silent "$expected" "$registry" || \
                    cargo_publish_error cargo-registry-version-conflict "published package bytes do not match the validated artifact"
                  exit 0
                fi
                test "$attempt" = 20 || sleep 15
              done
              cargo_publish_error cargo-registry-timeout "published Cargo version did not become readable"
              ;;
            *)
              cargo_publish_error cargo-registry-unavailable "crates.io version lookup returned HTTP $status"
              ;;
          esac

  stage-npm:
    name: Stage npm packages for maintainer approval
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attest, collect, draft-release, publish-cargo]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install staged-publishing npm CLI
        shell: bash
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-candidate
          path: validated

      - name: Stage the complete npm package graph
        env:
          EXPECTED_SOURCE_DIGEST: ${{ needs.attest.outputs.source-digest }}
          EXPECTED_TAG_DIGEST: ${{ needs.attest.outputs.tag-digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.collect.outputs.version }}
        shell: bash
        run: |
          release_tag_not_trusted() {
            printf '{"code":"release-tag-not-trusted","message":"%s"}\n' "$1" >&2
            exit 1
          }
          recheck_release_tag() {
            current_tag_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
              --jq 'select(.object.type == "tag") | .object.sha') || \
              release_tag_not_trusted "release tag ref cannot be resolved"
            test -n "$current_tag_digest" && test "$current_tag_digest" = "$EXPECTED_TAG_DIGEST" || \
              release_tag_not_trusted "release tag object moved after attestation"
            current_source_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$EXPECTED_TAG_DIGEST" \
              --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha') || \
              release_tag_not_trusted "annotated release tag cannot be resolved"
            test -n "$current_source_digest" && test "$current_source_digest" = "$EXPECTED_SOURCE_DIGEST" || \
              release_tag_not_trusted "release tag source changed after attestation"
            test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || \
              release_tag_not_trusted "GitHub release is no longer draft"
          }

          record="$RUNNER_TEMP/npm-stages-v${RELEASE_VERSION}.json"
          manifest="validated/npm/npm-artifacts.json"
          release_assets=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets)
          if printf '%s' "$release_assets" \
            | jq -e --arg name "$(basename "$record")" \
              '.assets | any(.name == $name)' >/dev/null
          then
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$(basename "$record")" \
              --dir "$RUNNER_TEMP"
            node npm/scripts/npm-staged-release.cjs verify "$record" "$manifest"
          else
            node npm/scripts/npm-staged-release.cjs create "$RELEASE_VERSION" "$manifest" "$record"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$record"
          fi

          while package=$(node npm/scripts/npm-staged-release.cjs next "$record") && [ "$package" != null ]; do
            package_name=$(printf '%s' "$package" | jq -r .name)
            artifact=$(printf '%s' "$package" | jq -r .file)
            recheck_release_tag
            output="$RUNNER_TEMP/npm-stage-output.json"
            npm stage publish "validated/npm/$artifact" \
              --tag latest \
              --access public \
              --provenance \
              --json > "$output"
            node npm/scripts/npm-staged-release.cjs record "$record" "$package_name" "$output"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$record"
          done
          node npm/scripts/npm-staged-release.cjs verify "$record" "$manifest"

  authorize-finalization-tag:
    name: Authorize signed tag finalization
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'stage-finalize'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source-digest: ${{ steps.tag.outputs.source-digest }}
      tag-digest: ${{ steps.tag.outputs.tag-digest }}
    steps:
      - name: Resolve verified signed recovery tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          release_tag_not_trusted() {
            printf '{"code":"release-tag-not-trusted","message":"%s"}\n' "$1" >&2
            exit 1
          }

          printf '%s' "$RELEASE_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || \
            release_tag_not_trusted "finalization version is invalid"
          if ! tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq '.object.type + " " + .object.sha'); then
            release_tag_not_trusted "release tag ref cannot be resolved"
          fi
          test "${tag_ref%% *}" = tag || \
            release_tag_not_trusted "release tag is not annotated"
          tag_digest=${tag_ref#* }
          if ! source_digest=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_digest" --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha'); then
            release_tag_not_trusted "annotated release tag cannot be resolved"
          fi
          test -n "$source_digest" || \
            release_tag_not_trusted "release tag signature is not GitHub-verified"
          if ! default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch); then
            release_tag_not_trusted "default branch cannot be resolved"
          fi
          if ! default_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$default_branch" --jq .object.sha); then
            release_tag_not_trusted "default branch head cannot be resolved"
          fi
          test "$GITHUB_REF" = "refs/heads/$default_branch" || \
            release_tag_not_trusted "release finalization must be dispatched from the default branch"
          test "$GITHUB_SHA" = "$default_head" || \
            release_tag_not_trusted "default branch moved after finalization started"
          if ! compare_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/${source_digest}...${default_head}" --jq .status); then
            release_tag_not_trusted "release tag commit cannot be compared with the default branch"
          fi
          if [ "$compare_status" != identical ] && [ "$compare_status" != ahead ]; then
            release_tag_not_trusted "release tag does not point at a commit on the default branch"
          fi
          if ! release_pr_count=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$source_digest/pulls" \
            | jq \
              --arg branch "$default_branch" \
              --arg sha "$source_digest" \
              '[.[] | select(.merged_at != null and .base.ref == $branch and .merge_commit_sha == $sha)] | length'); then
            release_tag_not_trusted "release pull request provenance cannot be resolved"
          fi
          test "$release_pr_count" = 1 || \
            release_tag_not_trusted "release tag commit was not produced by one merged release pull request"
          printf 'source-digest=%s\n' "$source_digest" >> "$GITHUB_OUTPUT"
          printf 'tag-digest=%s\n' "$tag_digest" >> "$GITHUB_OUTPUT"

  verify-published-npm:
    name: Verify approved npm package graph
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'stage-finalize'
    needs: authorize-finalization-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out signed release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.authorize-finalization-tag.outputs.source-digest }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require every approved package and provenance attestation
        env:
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          npm install --global npm@11.15.0
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern npm-artifacts.json \
            --pattern "npm-stages-v${RELEASE_VERSION}.json" \
            --dir "$RUNNER_TEMP"
          node npm/scripts/npm-staged-release.cjs verify \
            "$RUNNER_TEMP/npm-stages-v${RELEASE_VERSION}.json" \
            "$RUNNER_TEMP/npm-artifacts.json"
          jq -c '.packages[]' "$RUNNER_TEMP/npm-artifacts.json" \
            | while IFS= read -r package; do
                package_name=$(printf '%s' "$package" | jq -r .package)
                expected_integrity=$(printf '%s' "$package" | jq -r .integrity)
                package_spec="${package_name}@${RELEASE_VERSION}"
                test "$(npm view "$package_spec" version --json | jq -r .)" = "$RELEASE_VERSION"
                test "$(npm view "$package_spec" dist.integrity --json | jq -r .)" = "$expected_integrity"
              done

  validate-published-npm:
    name: Validate approved npm packages on ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'stage-finalize'
    needs: [authorize-finalization-tag, verify-published-npm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-arm64-msvc
            runner: windows-11-arm
          - target: win32-x64-msvc
            runner: windows-2025
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install package managers
        shell: bash
        run: |
          npm install --global npm@11.15.0 pnpm@11.15.0

      - name: Clean-install and smoke both launcher identities
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          root="$RUNNER_TEMP/satelle-registry-validation"
          mkdir -p "$root"
          smoke() {
            binary=$1
            test "$("$binary" --version)" = "satelle $RELEASE_VERSION"
            "$binary" paths --json | node -e '
              const value = JSON.parse(require("fs").readFileSync(0, "utf8"));
              if (value.schema_version !== "satelle.paths.v2") process.exit(1);
            '
          }
          for package_name in @microck/satelle satelle; do
            package_label=$(printf '%s' "$package_name" | tr '/@' '__')
            package_spec="${package_name}@${RELEASE_VERSION}"
            for manager in npm pnpm bun; do
              install_root="$root/${manager}-${package_label}"
              mkdir -p "$install_root"
              node -e 'require("fs").writeFileSync(process.argv[1], "{\"private\":true}\n")' "$install_root/package.json"
              case "$manager" in
                npm)
                  npm install --prefix "$install_root" --include=optional --ignore-scripts --no-audit --no-fund "$package_spec"
                  npm audit signatures --prefix "$install_root"
                  ;;
                pnpm) pnpm --dir "$install_root" add --ignore-scripts "$package_spec" ;;
                bun) bun add --cwd "$install_root" --ignore-scripts "$package_spec" ;;
              esac
              smoke "$install_root/node_modules/.bin/satelle"
            done
          done

  publish-release:
    name: Publish the approved GitHub release
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'stage-finalize'
    needs: [authorize-finalization-tag, validate-published-npm, verify-published-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out signed release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.authorize-finalization-tag.outputs.source-digest }}

      - name: Download the validated signed-tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_DIGEST: ${{ needs.authorize-finalization-tag.outputs.source-digest }}
        shell: bash
        run: |
          source_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&branch=v${RELEASE_VERSION}&per_page=100")
          source_run_id=$(printf '%s' "$source_runs" | jq -r \
            --arg source_digest "$VERIFIED_SOURCE_DIGEST" \
            --arg tag "v${RELEASE_VERSION}" \
            '[.workflow_runs[] | select(
              .head_branch == $tag and
              .head_sha == $source_digest and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )] | sort_by(.run_number) | last | .id')
          printf '%s' "$source_run_id" | grep -Eq '^[1-9][0-9]*$'
          gh run download "$source_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name validated-release-candidate \
            --dir validated
          mkdir -p validated/npm
          gh release download "v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "npm-stages-v${RELEASE_VERSION}.json" \
            --dir validated/npm
          node npm/scripts/npm-staged-release.cjs verify \
            "validated/npm/npm-stages-v${RELEASE_VERSION}.json" \
            validated/npm/npm-artifacts.json

      - name: Recheck signed tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_POLICY_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SOURCE_DIGEST: ${{ needs.authorize-finalization-tag.outputs.source-digest }}
          EXPECTED_TAG_DIGEST: ${{ needs.authorize-finalization-tag.outputs.tag-digest }}
        shell: bash
        run: |
          release_tag_not_trusted() {
            printf '{"code":"release-tag-not-trusted","message":"%s"}\n' "$1" >&2
            exit 1
          }
          recheck_release_tag() {
            retry_mode=${1-}
            if ! current_tag_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq 'select(.object.type == "tag") | .object.sha')
            then
              if [ "$retry_mode" = retry_transient ]; then
                return 1
              fi
              release_tag_not_trusted "release tag ref cannot be resolved"
            fi
            test -n "$current_tag_digest" && test "$current_tag_digest" = "$EXPECTED_TAG_DIGEST" || \
              release_tag_not_trusted "release tag object moved after attestation"
            if ! current_source_digest=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$EXPECTED_TAG_DIGEST" \
              --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha')
            then
              if [ "$retry_mode" = retry_transient ]; then
                return 1
              fi
              release_tag_not_trusted "annotated release tag cannot be resolved"
            fi
            test -n "$current_source_digest" && test "$current_source_digest" = "$EXPECTED_SOURCE_DIGEST" || \
              release_tag_not_trusted "release tag source changed after attestation"
          }

          release_asset_invalid() {
            printf '{"code":"release-asset-invalid","message":"%s"}\n' "$1" >&2
            exit 1
          }
          require_immutable_releases() {
            test -n "$RELEASE_POLICY_TOKEN" || \
              release_asset_invalid "immutable release policy token is not configured"
            immutable_releases=$(GH_TOKEN="$RELEASE_POLICY_TOKEN" gh api \
              "repos/$GITHUB_REPOSITORY/immutable-releases" \
              --jq .enabled) || \
              release_asset_invalid "immutable release policy cannot be resolved"
            test "$immutable_releases" = true || \
              release_asset_invalid "immutable releases are not enabled"
          }
          recheck_release_tag
          downloaded="$RUNNER_TEMP/final-release-assets"
          expected_names="$RUNNER_TEMP/expected-release-asset-names"
          expected_manifest="$RUNNER_TEMP/expected-release-assets.sha256"
          verified_assets="$RUNNER_TEMP/verified-release-assets"
          current_assets="$RUNNER_TEMP/current-release-assets"
          mkdir -p "$downloaded"
          : > "$expected_names"
          : > "$expected_manifest"
          : > "$verified_assets"

          draft_release=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s -e -c --arg tag "$RELEASE_TAG" \
              '[.[][] | select(
                .tag_name == $tag and .draft == true and .immutable == false
              )] | select(length == 1) | .[0]') || \
            release_asset_invalid "draft release identity cannot be resolved"
          release_id=$(printf '%s' "$draft_release" | jq -r .id)
          printf '%s' "$release_id" | grep -Eq '^[1-9][0-9]*$' || \
            release_asset_invalid "release is not a mutable draft"
          mutable_draft_query='.id == $id and .tag_name == $tag and
            .draft == true and .immutable == false'

          static_files=(
            validated/tegami-validation.json
            validated/tegami-changelog-validation.json
            validated/release-orchestration.json
            validated/cargo/*
            validated/github/*
            validated/npm/npm-artifacts.json
            "validated/npm/npm-stages-v${RELEASE_VERSION}.json"
          )
          for file in "${static_files[@]}"; do
            asset_name=$(basename "$file")
            digest=$(sha256sum "$file" | cut -d ' ' -f1)
            printf '%s\n' "$asset_name" >> "$expected_names"
            printf '%s  %s\n' "$digest" "$asset_name" >> "$expected_manifest"
          done
          LC_ALL=C sort -o "$expected_names" "$expected_names"

          printf '%s' "$draft_release" \
            | jq -r '.assets[] | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r asset_id asset_name; do
                grep -Fqx "$asset_name" "$expected_names" || \
                  release_asset_invalid "release contains unrecognized asset $asset_name"
                gh api \
                  -H 'Accept: application/octet-stream' \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                  > "$downloaded/$asset_name"
                printf '%s\t%s\n' "$asset_id" "$asset_name" >> "$verified_assets"
              done

          (cd "$downloaded" && sha256sum --check "$expected_manifest") || \
            release_asset_invalid "release asset digest does not match the validated candidate"
          node npm/scripts/npm-staged-release.cjs verify \
            "$downloaded/npm-stages-v${RELEASE_VERSION}.json" \
            "$downloaded/npm-artifacts.json"

          recheck_release_tag
          LC_ALL=C sort -o "$verified_assets" "$verified_assets"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq '.assets[] | [.id, .name] | @tsv' \
            | LC_ALL=C sort > "$current_assets"
          cmp -s "$current_assets" "$verified_assets" || \
            release_asset_invalid "release asset set changed during final verification"
          require_immutable_releases
          publication_state=
          for attempt in $(seq 1 10); do
            if ! recheck_release_tag retry_transient; then
              test "$attempt" -lt 10 || \
                release_asset_invalid "release publication tag could not be rechecked"
              sleep 1
              continue
            fi
            if ! draft_state=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$release_id")
            then
              test "$attempt" -lt 10 || \
                release_asset_invalid "draft release identity could not be rechecked"
              sleep 1
              continue
            fi
            printf '%s' "$draft_state" | jq -e \
              --arg tag "$RELEASE_TAG" \
              --argjson id "$release_id" \
              "$mutable_draft_query" \
              >/dev/null || \
              release_asset_invalid "draft release identity changed before publication"
            if publication_state=$(gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false \
              -f make_latest=true)
            then
              break
            fi

            if publication_state=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$release_id")
            then
              if printf '%s' "$publication_state" | jq -e \
                --arg tag "$RELEASE_TAG" \
                --argjson id "$release_id" \
                '.id == $id and .tag_name == $tag and .draft == false and
                 (.immutable == true or .immutable == false)' \
                >/dev/null
              then
                break
              fi
              printf '%s' "$publication_state" | jq -e \
                --arg tag "$RELEASE_TAG" \
                --argjson id "$release_id" \
                '.id == $id and .tag_name == $tag and .draft == true and .immutable == false' \
                >/dev/null || \
                release_asset_invalid "release publication returned an invalid state"
            fi
            test "$attempt" -lt 10 || \
              release_asset_invalid "release publication state could not be reconciled"
            sleep 1
          done
          if printf '%s' "$publication_state" | jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .draft == false and .immutable == true' \
            >/dev/null
          then
            exit 0
          fi
          printf '%s' "$publication_state" | jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .draft == false and .immutable == false' \
            >/dev/null || \
            release_asset_invalid "release publication returned an invalid state"

          rollback_state=
          for attempt in $(seq 1 10); do
            if ! recheck_release_tag retry_transient; then
              test "$attempt" -lt 10 || \
                release_asset_invalid "release tag could not be rechecked for draft restoration"
              sleep 1
              continue
            fi
            if rollback_state=$(gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=true)
            then
              :
            elif rollback_state=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/$release_id")
            then
              :
            else
              test "$attempt" -lt 10 || \
                release_asset_invalid "draft restoration state could not be reconciled"
              sleep 1
              continue
            fi

            if printf '%s' "$rollback_state" | jq -e \
              --arg tag "$RELEASE_TAG" \
              --argjson id "$release_id" \
              '.id == $id and .tag_name == $tag and .draft == true and .immutable == false' \
              >/dev/null
            then
              break
            fi
            printf '%s' "$rollback_state" | jq -e \
              --arg tag "$RELEASE_TAG" \
              --argjson id "$release_id" \
              '.id == $id and .tag_name == $tag and .draft == false and .immutable == false' \
              >/dev/null || \
              release_asset_invalid "draft restoration returned an invalid state"
            test "$attempt" -lt 10 || \
              release_asset_invalid "mutable release could not be restored to draft"
            sleep 1
          done
          printf '%s' "$rollback_state" | jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .draft == true and .immutable == false' \
            >/dev/null || \
            release_asset_invalid "mutable release remained public after draft restoration"
          release_asset_invalid "published release was not immutable and was restored to draft"
